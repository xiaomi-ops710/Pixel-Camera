<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="無音カメラ">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>無音カメラ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== アイコンスプライト ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></symbol>
  <symbol id="i-level" viewBox="0 0 24 24"><path d="M3 12h5M16 12h5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/></symbol>
  <symbol id="i-timer-off" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5M4 4l16 16"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M19.5 5v4.5H15M4.5 19v-4.5H9"/><path d="M18.6 9.5A7.5 7.5 0 0 0 5.4 8.2M5.4 14.5a7.5 7.5 0 0 0 13.2 1.3"/></symbol>
  <symbol id="i-burst" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M5 16V6a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7M10.5 11v5M13.5 11v5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.3"/><circle cx="17.5" cy="6" r="2.3"/><circle cx="17.5" cy="18" r="2.3"/><path d="M8 11l7.5-4M8 13l7.5 4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
</svg>

<div id="app" data-mode="photo">

  <!-- ===== プレビュー領域 ===== -->
  <main id="stage">
    <div id="viewport">
      <div id="zoomer"><video id="video" playsinline muted autoplay disablepictureinpicture></video></div>
      <div id="gridlines" hidden><i style="left:33.333%"></i><i style="left:66.666%"></i><b style="top:33.333%"></b><b style="top:66.666%"></b></div>
      <div id="level" hidden>
        <div id="lv-line"><span class="tick l"></span><span class="bar"></span><span class="tick r"></span></div>
        <div id="lv-flat" hidden><span class="ring"></span><span class="cross-h"></span><span class="cross-v"></span><span id="lv-dot"></span></div>
      </div>
      <div id="focus" hidden></div>
      <div id="flashfx"></div>
      <div id="countdown" hidden></div>
    </div>

    <!-- 左上ツールバー -->
    <div id="topbar">
      <button class="ib sm" id="btn-settings" aria-label="設定"><svg class="ic"><use href="#i-sliders"/></svg></button>
      <button class="ib sm" id="btn-grid" aria-label="グリッド"><svg class="ic"><use href="#i-grid"/></svg></button>
      <button class="ib sm" id="btn-level" aria-label="水準器"><svg class="ic"><use href="#i-level"/></svg></button>
      <span class="chip silent"><svg class="ic"><use href="#i-mute"/></svg>無音</span>
      <span class="chip" id="chip-res">—</span>
    </div>

    <!-- 録画タイマー / 連写カウンタ -->
    <div id="rec-chip" hidden><span class="dot"></span><span id="rec-time">0:00</span></div>
    <div id="burst-chip" hidden><span id="burst-n">0</span> 枚</div>
    <div id="pending-chip" hidden>保存中 <span id="pending-n">0</span></div>

    <!-- ズーム -->
    <button class="ib zoombtn" id="zoombtn" aria-label="ズーム">1×</button>
    <div id="zoompanel" hidden>
      <div id="zoompresets"></div>
      <input id="zoomslider" type="range" min="1" max="10" step="0.05" value="1" aria-label="ズーム倍率">
    </div>

    <!-- エラー表示 -->
    <div id="camerror" hidden>
      <div class="card">
        <h2>カメラを開始できません</h2>
        <p id="camerror-msg"></p>
        <button class="btn filled" id="btn-retry">もう一度試す</button>
      </div>
    </div>
  </main>

  <!-- ===== 操作パネル ===== -->
  <aside id="controls">
    <button class="ib" id="btn-burst" aria-label="連写モード"><svg class="ic"><use href="#i-burst"/></svg></button>
    <button class="ib" id="btn-timer" aria-label="セルフタイマー"><svg class="ic"><use href="#i-timer-off"/></svg><span class="sub" id="timer-sub"></span></button>
    <button class="ib" id="btn-flip" aria-label="カメラ切替"><svg class="ic"><use href="#i-flip"/></svg></button>
    <div id="shutter-wrap">
      <button id="shutter" aria-label="シャッター"><span id="shutter-in"></span></button>
      <button class="ib sm" id="btn-snap" hidden aria-label="録画中に静止画"><svg class="ic"><use href="#i-camera"/></svg></button>
    </div>
    <button id="btn-gallery" aria-label="ギャラリー"><img id="thumb" alt=""><svg class="ic" id="thumb-ph"><use href="#i-image"/></svg></button>
    <nav id="modes">
      <button class="mode" data-mode="video">ビデオ</button>
      <button class="mode sel" data-mode="photo">写真</button>
      <button class="mode" data-mode="square">スクエア</button>
    </nav>
  </aside>
</div>

<!-- ===== ギャラリー ===== -->
<section id="gallery" class="sheet" hidden>
  <header class="appbar">
    <button class="ib flat" id="g-close" aria-label="閉じる"><svg class="ic"><use href="#i-back"/></svg></button>
    <h1 id="g-title">ギャラリー</h1>
    <div class="spacer"></div>
    <button class="btn text" id="g-select">選択</button>
  </header>
  <div class="chips" id="g-filters">
    <button class="fchip sel" data-f="all">すべて</button>
    <button class="fchip" data-f="photo">写真</button>
    <button class="fchip" data-f="video">ビデオ</button>
  </div>
  <div id="g-grid"></div>
  <div id="g-empty" hidden>まだ撮影した項目がありません</div>
  <footer id="g-actions" hidden>
    <span id="g-count">0件選択</span>
    <div class="spacer"></div>
    <button class="btn tonal" id="g-all">すべて選択</button>
    <button class="btn tonal" id="g-share"><svg class="ic sm"><use href="#i-share"/></svg>共有・保存</button>
    <button class="btn tonal danger" id="g-del"><svg class="ic sm"><use href="#i-trash"/></svg>削除</button>
  </footer>
</section>

<!-- ===== ビューア ===== -->
<section id="viewer" class="sheet black" hidden>
  <header class="appbar overlay">
    <button class="ib flat" id="v-close" aria-label="戻る"><svg class="ic"><use href="#i-back"/></svg></button>
    <h1 id="v-title"></h1>
    <div class="spacer"></div>
    <button class="ib flat" id="v-info" aria-label="情報"><svg class="ic"><use href="#i-info"/></svg></button>
    <button class="ib flat" id="v-download" aria-label="ファイルに保存"><svg class="ic"><use href="#i-download"/></svg></button>
    <button class="ib flat" id="v-share" aria-label="共有"><svg class="ic"><use href="#i-share"/></svg></button>
    <button class="ib flat" id="v-del" aria-label="削除"><svg class="ic"><use href="#i-trash"/></svg></button>
  </header>
  <div id="vstage"></div>
  <button class="ib nav l" id="v-prev" aria-label="前へ"><svg class="ic"><use href="#i-back"/></svg></button>
  <button class="ib nav r" id="v-next" aria-label="次へ"><svg class="ic"><use href="#i-next"/></svg></button>
  <div id="v-infobox" hidden></div>
</section>

<!-- ===== 設定 ===== -->
<section id="settings" class="scrim" hidden>
  <div class="panel">
    <header class="appbar">
      <h1>設定</h1><div class="spacer"></div>
      <button class="ib flat" id="s-close" aria-label="閉じる"><svg class="ic"><use href="#i-close"/></svg></button>
    </header>

    <h3>写真の画質</h3>
    <div class="row"><label>撮影解像度<small>カメラが対応する最大まで自動で上がります</small></label>
      <div class="seg" data-key="photoRes"><button data-v="max">最大</button><button data-v="4k">4K</button><button data-v="fhd">FHD</button></div></div>
    <div class="row"><label>保存形式<small>PNGは無劣化だが容量が大きい</small></label>
      <div class="seg" data-key="fmt"><button data-v="jpeg">JPEG</button><button data-v="png">PNG</button></div></div>
    <div class="row col"><label>JPEG品質 <b id="q-val"></b><small>95〜100推奨。資料の細かい文字は高いほど有利</small></label>
      <input type="range" data-key="quality" min="0.8" max="1" step="0.01"></div>
    <div class="row"><label>デジタルズーム時の出力<small>「切り出し」は拡大補間せず元画素のまま保存</small></label>
      <div class="seg" data-key="zoomOut"><button data-v="crop">切り出し(劣化なし)</button><button data-v="fit">元サイズに拡大</button></div></div>

    <h3>ビデオ</h3>
    <div class="row"><label>解像度</label>
      <div class="seg" data-key="videoRes"><button data-v="2160">4K</button><button data-v="1080">1080p</button><button data-v="720">720p</button></div></div>
    <div class="row"><label>フレームレート</label>
      <div class="seg" data-key="fps"><button data-v="24">24</button><button data-v="30">30</button><button data-v="60">60</button></div></div>
    <div class="row"><label>音声を録音<small>OFFのままなら完全に無音の動画になります</small></label>
      <input type="checkbox" class="switch" data-key="audio"></div>

    <h3>連写</h3>
    <div class="row"><label>撮影間隔</label>
      <div class="seg" data-key="burstInterval"><button data-v="0">最速</button><button data-v="200">0.2秒</button><button data-v="500">0.5秒</button><button data-v="1000">1秒</button></div></div>
    <div class="row"><label>最大枚数</label>
      <div class="seg" data-key="burstMax"><button data-v="20">20</button><button data-v="60">60</button><button data-v="150">150</button><button data-v="300">300</button></div></div>

    <h3>表示・操作</h3>
    <div class="row"><label>グリッド</label><input type="checkbox" class="switch" data-key="grid"></div>
    <div class="row"><label>水準器<small>机に置いて真上から撮る時は十字、立てた時は水平線</small></label><input type="checkbox" class="switch" data-key="level"></div>
    <div class="row"><label>撮影時の画面フラッシュ<small>音の代わりの視覚フィードバック</small></label><input type="checkbox" class="switch" data-key="flash"></div>
    <div class="row"><label>前面カメラの保存時にミラー反転</label><input type="checkbox" class="switch" data-key="mirror"></div>

    <h3>ストレージ</h3>
    <div class="row col"><label>使用量 <b id="s-usage">—</b><small>撮影データはこの端末内(アプリ内)に保存されます。ギャラリーから「共有・保存」で写真Appやファイルへ書き出せます。</small></label>
      <button class="btn tonal danger" id="s-wipe">すべての撮影データを削除</button></div>

    <h3>このアプリについて</h3>
    <p class="about">シャッター音・効果音・振動を一切使用しません。端末の消音スイッチやマナー設定に依存しない、図書館向けの静音設計です。画像はプレビューと同じ映像ストリームの原寸フレームから直接書き出し、再圧縮や縮小を行いません。</p>
  </div>
</section>

<!-- ===== ダイアログ / トースト ===== -->
<div id="dlg" class="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h2 id="dlg-title"></h2><p id="dlg-text"></p>
    <div class="actions"><button class="btn text" id="dlg-cancel">キャンセル</button><button class="btn text strong" id="dlg-ok">OK</button></div>
  </div>
</div>
<div id="toast" hidden><span></span></div>

<script src="app.js"></script>
</body>
</html>
